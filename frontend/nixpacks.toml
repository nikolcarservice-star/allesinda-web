[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm build"]

# next.config.mjs: output standalone — не использовать `next start` / `pnpm start`
[start]
cmd = "env HOSTNAME=0.0.0.0 node .next/standalone/server.js"

[variables]
NODE_ENV = "production"
