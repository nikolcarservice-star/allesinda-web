[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

# Next standalone: в .next/standalone нужно явно положить public и .next/static,
# иначе /_next/static/* даёт 404/HTML → «белая» страница и MIME text/html для .css
[phases.build]
cmds = [
  "pnpm build",
  "cp -r public .next/standalone/public",
  "mkdir -p .next/standalone/.next",
  "cp -r .next/static .next/standalone/.next/static",
]

# Старт из каталога standalone + HOSTNAME для Traefik/Coolify
[start]
cmd = "cd .next/standalone && exec env HOSTNAME=0.0.0.0 node server.js"

[variables]
NODE_ENV = "production"
